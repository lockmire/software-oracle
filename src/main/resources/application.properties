repo.path=

# Active importers (comma-separated: git, java, maven, jira)
oracle.importers=git,java,maven

# Jira (used by the jira importer; run it together with/after git).
# All optional: without jira.uri the importer still builds Issue stubs and
# MergeRequest nodes from the git history alone.
# jira.projectKeys (comma-separated, e.g. ORACLE,PLATFORM) restricts issue-key
# matching to those projects — recommended to avoid false positives.
jira.uri=
jira.email=
jira.token=
jira.projectKeys=
neo4j.uri=
neo4j.username=
neo4j.password=

# Oracle server
oracle.port=8080
ollama.uri=http://localhost:11434
ollama.model=llama3:latest
ollama.timeoutSeconds=180
